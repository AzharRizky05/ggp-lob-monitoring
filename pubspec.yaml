name: ggp_lob_monitoring
description: Sistem Monitoring Produksi Liquid Organic Biofertilizer Berbasis Web
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  dio: ^5.4.0

  cupertino_icons: ^1.0.8

  # =============================
  # State Management
  # =============================
  provider: ^6.1.5+1

  # =============================
  # Navigation
  # =============================
  go_router: ^16.2.0

  # =============================
  # Font
  # =============================
  google_fonts: ^6.3.0

  # =============================
  # Dashboard Chart
  # =============================
  fl_chart: ^1.2.0

  # =============================
  # Formatting
  # =============================
  intl: ^0.20.3

  # =============================
  # Local Storage
  # =============================
  shared_preferences: ^2.5.5

  # =============================
  # Animation
  # =============================
  flutter_animate: ^4.5.2

  # =============================
  # UUID
  # =============================
  uuid: ^4.5.3

  # =============================
  # Supabase
  # =============================
  supabase_flutter: ^2.9.1

  # =============================
  # Environment Variable
  # =============================
  flutter_dotenv: ^5.2.1

  # =============================
  # Logging
  # =============================
  logger: ^2.6.1

  # =============================
  # Connectivity
  # =============================
  connectivity_plus: ^6.1.5
  web: ^1.1.1
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/logo/
    - .env